services:
  api:
    build: .
    restart: always
    depends_on:
      - mongodb
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=todo_db
  mongodb:
    image: "mongo:latest"
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
